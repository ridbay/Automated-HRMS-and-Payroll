name = "zenhr-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
account_id = "3f509287c54b566a4a6fba51ec5bc842"

[dev]
port = 8788

[[d1_databases]]
binding = "DB"
database_name = "zenhr-prod-db"
database_id = "181fd234-a5d0-4c0a-a226-387ba3625bc9"
migrations_dir = "drizzle"

# Needed for employee document uploads (already-existing code path) and
# candidate resumes. Requires the "zenhr-storage" bucket to exist — create it
# with `wrangler r2 bucket create zenhr-storage` (or via the dashboard) once
# R2 is activated on this Cloudflare account; `wrangler dev`/`deploy` will
# fail on the binding until that bucket exists.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zenhr-storage"

[ai]
binding = "AI"

# Cloudflare AI Search (formerly AutoRAG) — indexes uploaded company
# knowledge-base documents straight out of the zenhr-storage R2 bucket
# (PDF/DOCX/etc extracted and chunked automatically). Scoped at instance
# creation to "companies/*/documents/**" only, so it never sees candidate
# resumes or branding assets living under other prefixes in the same bucket.
# `remote = true` because there's no local emulation of the vector index —
# `wrangler dev` always hits the real hosted instance.
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "zenhr-company-docs"
remote = true
