<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Figure 4.7</title>
<!--
  Figure 4.7: Public careers page for an open requisition.
  Real screenshot (local stack, demo company Ebony Crest Foods Ltd) reachable at the public URL
  /careers/:companyIdentifier/:requisitionId without an authentication gate.
  Capture:
    node scripts/demo/capture.mjs anon project/figures/screens/fig4_7_careers_requisition.png --path "/careers/comp-73F42AE6/REQ-DEMO-comp-73F42AE6-0" --wait 3000 --width 1440 --height 900
  Crop (2x): sips -c 1600 2880 --cropOffset 0 0 project/figures/screens/fig4_7_careers_requisition.png --out project/figures/screens/fig4_7_careers_crop.png
  Render: scripts/figures/render.sh figure_4_7 1100 680
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; color: #111; width: 1100px; }
  .wrap { padding: 14px 20px; }
  .browser-window {
    border: 1.5px solid #b0b7c3;
    border-radius: 8px;
    overflow: hidden;
    background: #f1f3f5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .browser-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: #e9ecef;
    border-bottom: 1px solid #ced4da;
  }
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
  .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
  .dot-green { background: #27c93f; border: 1px solid #1aab29; }
  .nav-btns {
    display: flex;
    gap: 8px;
    color: #6c757d;
    font-size: 13px;
    user-select: none;
  }
  .url-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid #ced4da;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    color: #495057;
  }
  .lock { font-size: 11px; opacity: 0.7; }
  .url { letter-spacing: -0.2px; }
  .browser-content { line-height: 0; }
  .browser-content img { width: 100%; display: block; }
  .lab { font-size: 16.5px; margin: 12px 0 6px; text-align: center; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap">
  <div class="browser-window">
    <div class="browser-bar">
      <div class="dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="nav-btns">
        <span>&larr;</span>
        <span>&rarr;</span>
        <span>&#8635;</span>
      </div>
      <div class="url-bar">
        <span class="lock">&#128274;</span>
        <span class="url">https://zenhr.example/careers/comp-73F42AE6/REQ-DEMO-comp-73F42AE6-0</span>
      </div>
    </div>
    <div class="browser-content">
      <img src="../screens/fig4_7_careers_crop.png">
    </div>
  </div>
  <div class="lab">Public careers page for an open requisition, reachable at a shareable URL without authentication</div>
</div>
</body>
</html>
