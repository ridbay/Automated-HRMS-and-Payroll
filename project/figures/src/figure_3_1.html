<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Figure 3.1</title>
<!--
  Figure 3.1: High-level system architecture.
  Grounded in api/wrangler.toml (bindings DB, BUCKET, AI) and src/api/http.ts
  (the SPA calls the Worker directly at VITE_API_URL; Pages serves static assets only).
  Render: scripts/figures/render.sh figure_3_1 1100 925
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; font-family: Arial, Helvetica, sans-serif; }
  .h   { font-size: 23px; font-weight: 700; fill: #111; }
  .s   { font-size: 19px; fill: #222; }
  .lab { font-size: 18px; fill: #222; }
  .labb{ font-size: 18px; font-weight: 700; fill: #111; }
  .code{ font-size: 17px; font-family: Menlo, Consolas, monospace; fill: #333; }
  .zone{ font-size: 16px; font-weight: 700; fill: #555; letter-spacing: 1px; }
  .priv{ font-size: 17px; font-style: italic; fill: #0b3d91; }
  .no  { font-size: 18px; font-weight: 700; fill: #9b1c1c; }
</style>
</head>
<body>
<svg width="1100" height="925" viewBox="0 0 1100 925" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
    </marker>
    <marker id="ahs" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M12,0 L0,6 L12,12 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Browser client -->
  <rect x="200" y="20" width="700" height="110" rx="10" fill="#f2f2f2" stroke="#222" stroke-width="2.5"/>
  <text class="h" x="550" y="62" text-anchor="middle">Browser client</text>
  <text class="s" x="550" y="96" text-anchor="middle">React single-page application, executing in the user's browser</text>

  <!-- Cloudflare boundary -->
  <rect x="20" y="215" width="1060" height="620" rx="14" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="10 6"/>
  <text class="zone" x="1060" y="244" text-anchor="end">CLOUDFLARE GLOBAL NETWORK</text>

  <!-- Pages -->
  <rect x="50" y="275" width="300" height="160" rx="10" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text class="h" x="200" y="315" text-anchor="middle">Cloudflare Pages</text>
  <text class="s" x="200" y="350" text-anchor="middle">Static hosting of the</text>
  <text class="s" x="200" y="376" text-anchor="middle">compiled React SPA</text>
  <text class="s" x="200" y="402" text-anchor="middle">(HTML, JS, CSS)</text>

  <!-- Pages -> browser -->
  <line x1="260" y1="275" x2="260" y2="132" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
  <text class="labb" x="250" y="168" text-anchor="end">(1) Application</text>
  <text class="lab"  x="250" y="191" text-anchor="end">bundle, on load</text>

  <!-- Worker -->
  <rect x="400" y="275" width="650" height="190" rx="10" fill="#dbe6f7" stroke="#0b3d91" stroke-width="3.5"/>
  <text class="h" x="725" y="317" text-anchor="middle">Cloudflare Worker — zenhr-api (Hono)</text>
  <text class="s" x="725" y="354" text-anchor="middle">JWT authentication · tenant resolution ·</text>
  <text class="s" x="725" y="380" text-anchor="middle">RBAC · business logic for every module</text>
  <text class="code" x="725" y="436" text-anchor="middle">stateless; runs in V8 isolates, not containers</text>

  <!-- Browser <-> Worker -->
  <line x1="725" y1="134" x2="725" y2="273" stroke="#222" stroke-width="3" marker-start="url(#ahs)" marker-end="url(#ah)"/>
  <text class="labb" x="740" y="168">(2) HTTPS / JSON</text>
  <text class="lab"  x="740" y="191">API calls with bearer token</text>

  <!-- Private bindings zone -->
  <rect x="50" y="530" width="1000" height="275" rx="10" fill="#fafafa" stroke="#0b3d91" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text class="priv" x="550" y="790" text-anchor="middle">Worker bindings: reachable only from inside the Worker, never from the client</text>

  <!-- Fan-out: one trunk from the Worker, a bus, and a drop to each binding -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <path d="M725,465 V500"/>
    <path d="M215,500 H885"/>
    <path d="M215,500 V598" marker-end="url(#ah)"/>
    <path d="M550,500 V598" marker-end="url(#ah)"/>
    <path d="M885,500 V598" marker-end="url(#ah)"/>
  </g>
  <text class="code" x="228" y="575">env.DB</text>
  <text class="code" x="563" y="575">env.BUCKET</text>
  <text class="code" x="898" y="575">env.AI</text>

  <!-- D1 -->
  <rect x="75" y="600" width="280" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text class="h" x="215" y="640" text-anchor="middle">Cloudflare D1</text>
  <text class="s" x="215" y="675" text-anchor="middle">Relational data</text>
  <text class="s" x="215" y="701" text-anchor="middle">(SQLite; Drizzle schema)</text>

  <!-- R2 -->
  <rect x="410" y="600" width="280" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text class="h" x="550" y="640" text-anchor="middle">Cloudflare R2</text>
  <text class="s" x="550" y="675" text-anchor="middle">Object storage</text>
  <text class="s" x="550" y="701" text-anchor="middle">(documents, résumés)</text>

  <!-- Workers AI -->
  <rect x="745" y="600" width="280" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text class="h" x="885" y="640" text-anchor="middle">Cloudflare Workers AI</text>
  <text class="s" x="885" y="675" text-anchor="middle">LLM inference</text>
  <text class="s" x="885" y="701" text-anchor="middle">(assistant module)</text>

  <!-- No direct path -->
  <text class="no" x="550" y="878" text-anchor="middle">✗  No path exists from the browser to D1, R2, or Workers AI;</text>
  <text class="no" x="550" y="904" text-anchor="middle">every data access is mediated by the Worker.</text>
</svg>
</body>
</html>
